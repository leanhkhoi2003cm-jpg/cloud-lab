services:
  backend:
    build:
      context: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - mern-network

  frontend:
    build:
      context: ./client
    container_name: mern-frontend
    ports:
      - "5173:4173"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge