services:
  backend:
    image: leanhkhoi2906/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      default:
        aliases:
          - mern-backend

  frontend:
    image: leanhkhoi2906/mern-frontend:2.0
    container_name: mern-frontend-hub
    ports:
      - "5173:4173"
    depends_on:
      - backend